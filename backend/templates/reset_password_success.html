<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset — Cardify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #006769;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .checkmark {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #9FE88D;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-name">Cardify</div>
    <div class="checkmark">✅</div>
    <h1>Password Reset!</h1>
    <p>Your password has been updated successfully.<br>You can close this page and log in to the app.</p>
  </div>
</body>
</html>
