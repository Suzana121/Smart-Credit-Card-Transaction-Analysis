<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Cardify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #006769;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .error-box {
      background: rgba(226, 49, 37, 0.15);
      border: 1px solid #e23125;
      border-radius: 10px;
      padding: 12px 16px;
      color: #ffaaaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: none;
      padding: 0 16px;
      font-size: 15px;
      background: rgba(255,255,255,0.9);
      color: #111;
      margin-bottom: 20px;
      outline: none;
    }

    input[type="password"]:focus {
      box-shadow: 0 0 0 2px #9FE88D;
    }

    button {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: none;
      background: #9FE88D;
      color: #111111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }

    input[type="hidden"] {}
  </style>
</head>
<body>
  <div class="card">
    <div class="app-name">Cardify</div>
    <h1>Reset<br>Password</h1>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    {% if token %}
    <form method="POST" action="/auth/reset-password-page">
      <input type="hidden" name="token" value="{{ token }}" />

      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password"
             placeholder="At least 6 characters" required minlength="6" />

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             placeholder="Repeat your password" required minlength="6" />

      <button type="submit">Set New Password</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
